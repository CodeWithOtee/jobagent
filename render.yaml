services:
  - type: web
    name: flowmind-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flowmind-db
          property: connectionString
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  - name: flowmind-db
    databaseName: flowmind
    user: flowmind
